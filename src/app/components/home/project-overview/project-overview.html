<section id="projects" class="flex flex-col gap-8" trackSection>
  <h2 class="text-center font-medium text-5xl uppercase tracking-wider">Projects</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 sm:gap-12">
    @for (project of projects; track $index) {
      <mat-card class="border-1 border-blue-500 dark:border-blue-950 bg-white dark:bg-blue-500!">
        <mat-card-header class="pb-4!">
          <mat-card-title>{{ project.title }}</mat-card-title>
          <mat-card-subtitle class="text-gray-500! dark:text-gray-400!">{{ project.sub_title }}</mat-card-subtitle>
        </mat-card-header>
        <img matCardImage class="max-h-48 object-cover" src="{{ project.url }}" alt="{{ project.title }}" />
        <mat-card-content class="pt-4!">
          <div class="flex flex-col gap-2">
            <mat-chip-set>
              @for (tech of project.technologies; track $index) {
                <mat-chip>
                  @if (tech.icon) {
                    <img matChipAvatar [src]="tech.icon" [alt]="tech.name" />
                  }
                  {{ tech.name }}</mat-chip
                >
              }
            </mat-chip-set>
            <p>{{ project.description }}</p>
          </div>
        </mat-card-content>
        <mat-card-footer class="p-4 mt-auto">
          <button mat-stroked-button [disabled]="!project.link" (click)="project.link === 'https://raveniis.github.io/Portfolio/' ? celebrate() : navigate()">
            {{ project.link ? 'View Website' : 'Link Unavailable' }}
          </button>
        </mat-card-footer>
      </mat-card>
    }
  </div>
</section>
